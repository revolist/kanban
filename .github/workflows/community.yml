name: Community package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sources/kanban
      - uses: actions/checkout@v5
        with:
          repository: revolist/grid-runtime
          ref: 19b0eab97c1a3e9d4bb79115c23af8c071940e0f
          path: sources/runtime
      - uses: actions/checkout@v5
        with:
          repository: revolist/revo-ui
          ref: ac54bf02317ca5a740277b832717d00ec1eb1fcb
          path: sources/ui
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Create public source workspace
        run: |
          (cd sources/kanban && node scripts/prepare-public-workspace.mjs)
          pnpm --dir sources/kanban install --no-frozen-lockfile --ignore-scripts
      - name: Check public sources
        run: |
          pnpm --dir sources/kanban --filter @revolist/grid-runtime format:check
          pnpm --dir sources/kanban --filter @revolist/grid-runtime lint
          pnpm --dir sources/kanban --filter @revolist/grid-runtime test
          pnpm --dir sources/kanban --filter @revolist/ui build:public
          pnpm --dir sources/kanban --filter @revolist/grid-runtime build
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase format:check
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase lint
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase test
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase build
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase test:core
      - name: Pack public candidates
        run: |
          mkdir artifacts
          pnpm --dir sources/runtime pack --out ../../artifacts/revolist-grid-runtime-4.0.9.tgz
          pnpm --dir sources/ui/dist pack --out ../../../artifacts/revolist-ui-4.0.9.tgz
          pnpm --dir sources/kanban/package pack --out ../../../artifacts/revolist-kanban-community-4.0.9.tgz
      - name: Install and test packed Community
        env:
          KANBAN_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: |
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase prepare:consumer
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase exec playwright install --with-deps chromium
          pnpm --dir sources/kanban --filter @revolist/kanban-showcase test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-candidate-and-browser-results
          path: |
            artifacts/*.tgz
            sources/kanban/test-results/
